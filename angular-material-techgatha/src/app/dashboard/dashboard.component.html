<div *ngIf="isLoading" class="loading-wrapper">
  <mat-spinner></mat-spinner>
</div>

<div *ngIf="!isLoading">

  <!-- ── Page Header ── -->
  <div class="page-header">
    <h2>Dashboard Overview</h2>
    <button mat-raised-button color="primary" routerLink="/employees/add">
      <mat-icon>person_add</mat-icon> Add Employee
    </button>
  </div>

  <!-- ── Stats Cards ── -->
  <div class="stats-grid" *ngIf="stats">

    <mat-card class="stat-card">
      <mat-card-content>
        <mat-icon class="stat-icon" color="primary">people</mat-icon>
        <span class="stat-value">{{ stats.totalEmployees }}</span>
        <span class="stat-label">Total Employees</span>
      </mat-card-content>
    </mat-card>

    <mat-card class="stat-card">
      <mat-card-content>
        <mat-icon class="stat-icon" style="color:#2e7d32">check_circle</mat-icon>
        <span class="stat-value">{{ stats.activeCount }}</span>
        <span class="stat-label">Active</span>
      </mat-card-content>
    </mat-card>

    <mat-card class="stat-card">
      <mat-card-content>
        <mat-icon class="stat-icon" color="warn">event_busy</mat-icon>
        <span class="stat-value">{{ stats.onLeaveCount }}</span>
        <span class="stat-label">On Leave</span>
      </mat-card-content>
    </mat-card>

  </div>

  <!-- ── Recent Employees ── -->
  <mat-card>
    <mat-card-header>
      <mat-card-title>Recently Joined</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <mat-list>
        <mat-list-item *ngFor="let emp of recentEmployees">
          <div mat-list-item-icon class="avatar-circle">{{ emp.avatar }}</div>
          <span matListItemTitle>{{ emp.firstName }} {{ emp.lastName }}</span>
          <span matListItemLine>{{ emp.role }} · {{ emp.department }}</span>
          <mat-chip [ngClass]="getStatusClass(emp.status)" style="margin-left:auto;">
            {{ emp.status }}
          </mat-chip>
        </mat-list-item>
      </mat-list>
    </mat-card-content>
    <mat-card-actions>
      <button mat-button color="primary" routerLink="/employees">View All Employees</button>
    </mat-card-actions>
  </mat-card>

</div>
